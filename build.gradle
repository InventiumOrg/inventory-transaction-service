plugins {
	id 'java'
	id 'maven-publish' 
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.inventium'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		url "https://packages.confluent.io/maven/"
	}
	gradlePluginPortal()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'software.amazon.awssdk:dynamodb-enhanced'
	implementation 'software.amazon.awssdk:dynamodb'
	implementation 'org.apache.avro:avro:1.11.3'
	implementation 'io.confluent:kafka-avro-serializer:7.5.0'
	implementation 'io.confluent:kafka-schema-registry-client:7.5.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}



dependencyManagement {
	imports {
		mavenBom 'software.amazon.awssdk:bom:2.29.15'
	}
}

tasks.named('bootBuildImage') {
	runImage = 'paketobuildpacks/ubuntu-noble-run:latest'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Define Maven repository to publish to
publishing {
    publications {
        maven(MavenPublication) {
        groupId = "com.inventium"
        artifactId = "inventory-transaction-service"
        version = "0.0.1-SNAPSHOT"
        from components.java
        }
    }
	repositories {
        maven {
			// Define the Buildkite repository to publish to
			url "https://packages.buildkite.com/inventium/inventory-transaction-service/maven2/"
			authentication {
				header(HttpHeaderAuthentication)
			}
			credentials(HttpHeaderCredentials) {
				name = "Authorization"
				value = "Bearer ${System.getenv('BUILDKITE_TOKEN')}"
			}
        }
    }
}


